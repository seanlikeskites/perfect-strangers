name: Documentation
on:
  push:
    branches:
      - main
    paths:
      - mkdocs.yml
      - docs/**
      - pyproject.toml
      - src/**
      - .github/workflows/docs.yml
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v5
      - name: Install Latex
        run: sudo apt-get install -y texlive-latex-extra poppler-utils
      - name: Make Diagrams
        working-directory: ./docs/diagrams
        run: sh make_diagrams.sh
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install Zensical
        run: pip install zensical mkdocstrings-python .
      - name: Zensical Build
        run: zensical build --clean 
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
