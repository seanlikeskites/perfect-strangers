name: Publish
on:
  push:
    tags:
      - v*
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    environment:
      name: pypi
      url: https://pypi.org/project/perfect-strangers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install hatch
      - run: hatch build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --verify-tag -t ${{ github.ref_name }}
